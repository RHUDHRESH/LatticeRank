[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftforge"
version = "1.0.0"
description = "Physics-grounded synthetic SEM pairs for cross-scale wafer-pattern localization"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "Pillow>=10.0",
  "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["driftforge*"]

